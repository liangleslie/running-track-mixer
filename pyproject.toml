[project]
name = "rtmix"
version = "0.1.0"
description = "Running tracks mashup mixer with beat-locked metronome overlay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "librosa>=0.10.2",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "tkinterdnd2>=0.7.0",
]

[project.scripts]
rtmix = "rtmix.cli:main"
rtmix-gui = "rtmix.gui:main"

[tool.uv]
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtmix"]
