name: Build Portable Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.os_label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: linux-x64
            runner: ubuntu-latest
            archive_path: dist/RunningTracksMixer-linux-x64.tar.gz
          - os_label: windows-x64
            runner: windows-latest
            archive_path: dist/RunningTracksMixer-windows-x64.zip
          - os_label: macos-arm64
            runner: macos-latest
            archive_path: dist/RunningTracksMixer-macos-arm64.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 xz-utils

      - name: Fetch static FFmpeg + FFprobe (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p packaging/bin
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg packaging/bin/ffmpeg
          cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe packaging/bin/ffprobe
          chmod +x packaging/bin/ffmpeg packaging/bin/ffprobe
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

      - name: Fetch static FFmpeg + FFprobe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging\bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Copy-Item ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe packaging\bin\ffmpeg.exe
          Copy-Item ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe packaging\bin\ffprobe.exe
          Remove-Item ffmpeg.zip
          Remove-Item -Recurse -Force ffmpeg_tmp

      - name: Install FFmpeg with rubberband via Homebrew (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev

      - name: Build, smoke-test, and archive portable bundle
        run: uv run python scripts/build_bundle.py --smoke-test --archive

      - name: Upload portable release artifact
        uses: actions/upload-artifact@v7
        with:
          name: RunningTracksMixer-${{ matrix.os_label }}
          path: ${{ matrix.archive_path }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
